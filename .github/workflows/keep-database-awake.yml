# Keeps the free Supabase project from pausing in a quiet week (NETZ_LAUNCH_PLAN.md 4.1).
# Once a day it calls the site's /api/health, which runs one tiny database query.
# Needs one repository secret: NETZ_SITE_URL, e.g. https://netz.example.com (no trailing slash).
# Free: GitHub Actions minutes for a public repo, or the free monthly minutes for a private one.

name: Keep database awake

on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC (08:47 IST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/health
        env:
          NETZ_SITE_URL: ${{ secrets.NETZ_SITE_URL }}
        run: |
          if [ -z "$NETZ_SITE_URL" ]; then
            echo "Set the NETZ_SITE_URL repository secret first."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 "$NETZ_SITE_URL/api/health"
